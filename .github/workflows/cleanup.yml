name: Cleanup — Delete ElevenLabs branch after PR merge

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  cleanup:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Delete ElevenLabs feature branch
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          AGENT_ID="agent_b02mlsj27d8tlz0zb5lqdmgmwfey"
          SOURCE_BRANCH="${{ github.head_ref }}"

          echo "Looking for ElevenLabs branch: $SOURCE_BRANCH"
          BRANCH_ID=$(curl -s "https://api.elevenlabs.io/v1/convai/agents/$AGENT_ID/branches" \
            -H "xi-api-key: $ELEVENLABS_API_KEY" | \
            jq -r --arg name "$SOURCE_BRANCH" '.results[] | select(.name == $name) | .id // empty')

          if [ -n "$BRANCH_ID" ] && [ "$BRANCH_ID" != "null" ]; then
            echo "Deleting ElevenLabs branch: $SOURCE_BRANCH ($BRANCH_ID)"
            # KNOWN BROKEN: this returns 405 Method Not Allowed and deletes nothing —
            # branches currently pile up on ElevenLabs and must be cleaned up manually.
            #
            # DO NOT "fix" this by switching to
            #   DELETE /v1/convai/agents/$AGENT_ID?branch_id=$BRANCH_ID
            # That pattern deletes the ENTIRE AGENT regardless of the branch_id query
            # param — confirmed the hard way in production on 2026-07-02/03. The correct
            # branch-scoped delete call is still unknown; verify with ElevenLabs
            # support/docs before changing this, and test against a throwaway agent
            # first, never production.
            curl -s -X DELETE \
              "https://api.elevenlabs.io/v1/convai/agents/$AGENT_ID/branches/$BRANCH_ID" \
              -H "xi-api-key: $ELEVENLABS_API_KEY"
            echo "Done."
          else
            echo "No ElevenLabs branch found for: $SOURCE_BRANCH (may have been deleted already)"
          fi
